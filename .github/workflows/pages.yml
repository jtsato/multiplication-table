name: Build and deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            cc/package-lock.json
            co/package-lock.json
            cw/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix cc
          npm ci --prefix co
          npm ci --prefix cw

      - name: Test and build cc
        working-directory: cc
        run: |
          npm run test
          npm run build

      - name: Test and build co
        working-directory: co
        run: |
          npm run test:run
          npm run build

      - name: Test and build cw
        working-directory: cw
        run: |
          npm run test
          npm run build

      - name: Test and build gt
        working-directory: gt
        run: |
          npm test
          npm run check
          npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble Pages artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p site/cc site/co site/cw site/gt
          cp -R cc/dist/. site/cc/
          cp -R co/dist/. site/co/
          cp -R cw/dist/. site/cw/
          cp -R gt/dist/. site/gt/

          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="pt-BR">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <meta name="description" content="Projetos de jogos educativos de tabuada." />
              <title>Projetos de Tabuada</title>
              <style>
                :root { color-scheme: light; font-family: system-ui, sans-serif; }
                body { margin: 0; min-height: 100vh; background: #f4f7fb; color: #172033; }
                main { width: min(960px, calc(100% - 32px)); margin: 0 auto; padding: 64px 0; }
                h1 { margin: 0 0 12px; font-size: clamp(2rem, 5vw, 3.5rem); }
                p { color: #526078; font-size: 1.1rem; }
                ul { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; padding: 24px 0 0; list-style: none; }
                a { display: block; padding: 24px; border: 1px solid #dce4f0; border-radius: 16px; background: #fff; color: #2456c6; font-weight: 700; text-decoration: none; box-shadow: 0 8px 24px rgb(35 58 100 / 8%); }
                a:hover, a:focus-visible { border-color: #2456c6; transform: translateY(-2px); }
              </style>
            </head>
            <body>
              <main>
                <h1>Projetos de Tabuada</h1>
                <p>Escolha uma das experiências educativas:</p>
                <ul>
                  <li><a href="./cc/">Ilhas da Tabuada</a></li>
                  <li><a href="./co/">Blocky Tables</a></li>
                  <li><a href="./cw/">Bloquilha</a></li>
                  <li><a href="./gt/">Tabuada em Blocos</a></li>
                </ul>
              </main>
            </body>
          </html>
          EOF

          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
