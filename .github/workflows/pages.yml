name: Build and deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  # Um deploy em voo nao deve ser cancelado: interromper o deploy-pages no meio
  # pode deixar o environment github-pages travado. A fila termina sozinha.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    # Teto de tempo, medido pelos runs que deram certo: o `99` e o mais lento e
    # leva 15 min com o E2E; os outros tres ficam entre 1 e 7. Vinte e cinco da
    # folga de sobra para o pior caso legitimo.
    #
    # Sem isto o job herda o padrao de SEIS HORAS. Em 18/08/2026 o espelho apt da
    # Azure ficou inacessivel nos runners, o `playwright install --with-deps`
    # pendurou, e dois jobs consumiram 73 e 154 minutos de runner sem entregar
    # nada — alem de travar a fila do Pages a tarde inteira, porque a
    # concorrencia nao cancela o que esta em voo.
    timeout-minutes: 25

    strategy:
      # Sem fail-fast para que um app quebrado nao esconda os outros tres.
      fail-fast: false
      matrix:
        app: [cc, '99', st, ds]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          # Uma chave de cache por app: mexer no lockfile de um nao invalida os
          # caches dos outros tres.
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies (${{ matrix.app }})
        working-directory: ${{ matrix.app }}
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Lint, typecheck, test and build (${{ matrix.app }})
        working-directory: ${{ matrix.app }}
        run: npm run ci

      # E2E roda no push, para os quatro apps.
      #
      # O teto deste passo e mais curto que o do job de proposito: ele leva um ou
      # dois minutos quando a rede coopera, e e exatamente onde o travamento
      # acontece. Falhar em dez minutos aponta o culpado de imediato, em vez de
      # gastar o teto inteiro num `apt-get update` que nunca responde.
      - name: Install Playwright browser (${{ matrix.app }})
        timeout-minutes: 10
        working-directory: ${{ matrix.app }}
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (${{ matrix.app }})
        working-directory: ${{ matrix.app }}
        run: npm run test:e2e

      - name: Upload build output (${{ matrix.app }})
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-${{ matrix.app }}
          path: ${{ matrix.app }}/dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Publicar leva menos de um minuto; quinze e teto de seguranca, nao estimativa.
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Checkout apenas para obter pages/index.html.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: site-*
          path: artifacts

      - name: Assemble Pages artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p site
          for app in cc 99 st ds; do
            mkdir -p "site/$app"
            cp -R "artifacts/site-$app/." "site/$app/"
          done
          cp pages/index.html site/index.html
          touch site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
