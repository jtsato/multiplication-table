name: Build and deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            cc/package-lock.json
            99/package-lock.json
            st/package-lock.json
            ds/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix cc
          npm ci --prefix 99
          npm ci --prefix st
          npm ci --prefix ds

      - name: Test and build cc
        working-directory: cc
        run: |
          npm run test
          npm run build

      - name: Test and build 99
        working-directory: '99'
        run: |
          npm run lint
          npm run test
          npm run build

      - name: Test and build st
        working-directory: st
        run: npm run verify

      - name: Test and build ds
        working-directory: ds
        run: npm run validate

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Assemble Pages artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p site/cc site/99 site/st site/ds
          cp -R cc/dist/. site/cc/
          cp -R 99/dist/. site/99/
          cp -R st/dist/. site/st/
          cp -R ds/dist/. site/ds/
          cp pages/index.html site/index.html
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
