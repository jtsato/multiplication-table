name: Build and deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            cc/package-lock.json
            99/package-lock.json
            st/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix cc
          npm ci --prefix 99
          npm ci --prefix st

      - name: Test and build cc
        working-directory: cc
        run: |
          npm run test
          npm run build

      - name: Test and build 99
        working-directory: '99'
        run: |
          npm run lint
          npm run test
          npm run build

      - name: Test and build st
        working-directory: st
        run: npm run verify

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Assemble Pages artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p site/cc site/99 site/st
          cp -R cc/dist/. site/cc/
          cp -R 99/dist/. site/99/
          cp -R st/dist/. site/st/
          cp pages/index.html site/index.html
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
