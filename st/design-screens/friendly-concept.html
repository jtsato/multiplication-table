<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Friendly Concept</title>
    <style>
      :root {
        --bg: #fdf7f3;
        --panel: #fffefb;
        --ink: #1c2a35;
        --muted: #4b5c6d;
        --pink: #f2d9dc;
        --mint: #d9f2d8;
        --peach: #f9e5d2;
        --lavender: #e9e0ff;
        --yellow: #f8e5a8;
        --brand: #e8c5c0;
        --brand-deep: #d7a9a0;
        --line: #f0d7d1;
        --shadow: rgba(97, 76, 70, 0.12);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: linear-gradient(180deg, #fffaf6 0%, #f9f0f3 100%);
        color: var(--ink);
      }
      .screen {
        width: min(1180px, 92vw);
        margin: 26px auto;
        padding: 24px;
        background: var(--panel);
        border: 3px solid var(--line);
        border-radius: 30px;
        box-shadow: 0 12px 0 var(--shadow);
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .brand-badge {
        width: 56px;
        height: 56px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--pink), var(--mint));
        border: 3px solid var(--ink);
        border-radius: 18px;
        transform: rotate(-6deg);
        font-size: 2rem;
      }
      h1 {
        margin: 0;
        font-size: clamp(2.4rem, 4vw, 4rem);
        line-height: 1;
      }
      .cash {
        background: var(--yellow);
        border: 3px solid var(--ink);
        border-radius: 999px;
        padding: 10px 18px;
        font-weight: 900;
      }
      .layout {
        display: grid;
        grid-template-columns: 1.35fr 0.75fr;
        gap: 18px;
      }
      .hero {
        position: relative;
        min-height: 360px;
        background: linear-gradient(180deg, #fff4ef 0%, #f2fdf2 100%);
        border: 3px solid var(--line);
        border-radius: 28px;
        overflow: hidden;
      }
      .shelf {
        position: absolute;
        left: 10%;
        right: 10%;
        bottom: 18%;
        height: 24%;
        border: 3px solid var(--ink);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.7);
      }
      .shelf::before,
      .shelf::after {
        content: "";
        position: absolute;
        inset: 20% 5% auto 5%;
        height: 12px;
        background: var(--peach);
        border: 3px solid var(--ink);
        border-radius: 999px;
      }
      .shelf::after {
        top: 56%;
      }
      .counter {
        position: absolute;
        left: 18%;
        right: 18%;
        bottom: 11%;
        height: 18%;
        background: #efc3ac;
        border: 3px solid var(--ink);
        border-radius: 20px;
      }
      .avatar {
        position: absolute;
        left: 50%;
        bottom: 12%;
        transform: translateX(-50%);
        width: 118px;
        height: 140px;
        background: #fff;
        border: 3px solid var(--ink);
        border-radius: 18px 18px 22px 22px;
      }
      .avatar .head {
        position: absolute;
        left: 31%;
        top: 17%;
        width: 38%;
        height: 29%;
        background: #f5c88c;
        border: 3px solid var(--ink);
        border-radius: 14px;
      }
      .avatar .body {
        position: absolute;
        left: 18%;
        right: 18%;
        bottom: 0;
        height: 42%;
        background: linear-gradient(180deg, var(--lavender), #d8d3ff);
        border: 3px solid var(--ink);
        border-radius: 18px 18px 12px 12px;
      }
      .avatar .hair {
        position: absolute;
        left: 22%;
        right: 22%;
        top: 10%;
        height: 18%;
        background: #5a443b;
        border: 3px solid var(--ink);
        border-radius: 12px 12px 6px 6px;
      }
      .panel {
        background: #fffdf8;
        border: 3px solid var(--line);
        border-radius: 24px;
        padding: 18px;
      }
      .panel + .panel {
        margin-top: 16px;
      }
      .tiny {
        font-size: 0.72rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 900;
        color: var(--muted);
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-top: 12px;
      }
      .metrics div {
        background: #f7f1ef;
        border: 2px solid var(--ink);
        border-radius: 16px;
        padding: 12px;
        text-align: center;
        font-weight: 900;
      }
      .question {
        display: flex;
        justify-content: center;
        gap: 12px;
        font-weight: 900;
        font-size: 2.2rem;
        margin: 16px 0 18px;
      }
      .answers {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .ans {
        border: 3px solid var(--ink);
        border-radius: 16px;
        padding: 14px 8px;
        text-align: center;
        font-weight: 900;
        background: #fff;
      }
      .ans:nth-child(1) {
        background: #e9f7df;
      }
      .ans:nth-child(2) {
        background: #fff5cc;
      }
      .ans:nth-child(3) {
        background: #e9ecff;
      }
      .bottom {
        margin-top: 20px;
        display: grid;
        grid-template-columns: 1.25fr 0.7fr;
        gap: 18px;
      }
      .items {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }
      .item {
        border: 3px solid var(--line);
        border-radius: 18px;
        background: #fffdfd;
        padding: 14px;
      }
      .icon {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        border: 3px solid var(--ink);
        background: linear-gradient(135deg, var(--pink), var(--mint));
        margin-bottom: 12px;
      }
      .price {
        font-weight: 900;
      }
      .button {
        display: block;
        text-align: center;
        border: 3px solid var(--ink);
        border-radius: 16px;
        background: linear-gradient(135deg, var(--pink), var(--mint));
        padding: 14px 16px;
        font-weight: 900;
        box-shadow: 0 7px 0 rgba(76, 61, 58, 0.14);
      }
      .button.alt {
        background: #fff;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <div class="topbar">
        <div class="brand">
          <div class="brand-badge">❤</div>
          <div>
            <div class="tiny">loja com carinho</div>
            <h1>Lojinha Doce</h1>
          </div>
        </div>
        <div class="cash">R$ 314</div>
      </div>

      <div class="layout">
        <div class="hero">
          <div class="shelf"></div>
          <div class="counter"></div>
          <div class="avatar">
            <div class="hair"></div>
            <div class="head"></div>
            <div class="body"></div>
          </div>
        </div>

        <div>
          <div class="panel">
            <div class="tiny">Meta do dia</div>
            <h2 style="margin: 10px 0 12px; font-size: 2rem; line-height: 1.1">3 clientes</h2>
            <div class="metrics">
              <div>🎯 8/10</div>
              <div>⭐ 5</div>
              <div>🧠 14</div>
              <div>🌟 +30</div>
            </div>
          </div>

          <div class="panel">
            <div class="tiny">Pergunta</div>
            <div class="question">
              <span>3</span><span>×</span><span>4</span><span>=</span><span>?</span>
            </div>
            <div class="answers">
              <div class="ans">11</div>
              <div class="ans">12</div>
              <div class="ans">15</div>
            </div>
          </div>
        </div>
      </div>

      <div class="bottom">
        <div>
          <div class="tiny" style="margin-bottom: 10px">loja</div>
          <div class="items">
            <div class="item">
              <div class="icon">📚</div>
              <h3 style="margin: 0 0 8px">Prateleira</h3>
              <div class="price">R$ 32</div>
            </div>
            <div class="item">
              <div class="icon">🎨</div>
              <h3 style="margin: 0 0 8px">Quadro</h3>
              <div class="price">R$ 50</div>
            </div>
            <div class="item">
              <div class="icon">🌼</div>
              <h3 style="margin: 0 0 8px">Jardim</h3>
              <div class="price">R$ 76</div>
            </div>
          </div>
        </div>

        <div class="panel" style="align-self: start">
          <div class="tiny">Próximo</div>
          <h2 style="margin: 10px 0 12px; font-size: 1.8rem">Nova loja</h2>
          <div class="button">Começar</div>
          <div class="button alt">Explorar</div>
        </div>
      </div>
    </div>
  </body>
</html>
