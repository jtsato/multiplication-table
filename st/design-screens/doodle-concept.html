<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doodle Concept</title>
    <style>
      :root {
        --bg: #f9f6f2;
        --panel: #fffdf9;
        --ink: #1d2a3a;
        --muted: #50657e;
        --primary: #49b6e5;
        --secondary: #263d5b;
        --success: #16a34a;
        --yellow: #f7d15b;
        --pink: #f8d0d8;
        --line: #e5d9ce;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; font-family: "Comic Sans MS", "Segoe UI", sans-serif;
        background: linear-gradient(180deg, #fff4ee 0%, #f6fafc 100%); color: var(--ink);
      }
      .screen {
        width: min(1180px, 92vw); margin: 26px auto; background: var(--panel);
        border: 3px solid var(--line); border-radius: 30px; padding: 26px; box-shadow: 0 12px 0 rgba(38,61,91,0.06);
      }
      .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
      .brand { display: flex; align-items: center; gap: 12px; }
      .brand-badge {
        width: 56px; height: 56px; display: grid; place-items: center; border-radius: 16px;
        background: var(--primary); border: 3px solid var(--ink); transform: rotate(-5deg);
        font-size: 2rem;
      }
      h1 { margin: 0; font-size: clamp(2.4rem, 4vw, 4rem); line-height: 1; }
      .cash { background: var(--yellow); border: 3px solid var(--ink); border-radius: 999px; padding: 10px 18px; font-weight: 900; }
      .layout { display: grid; grid-template-columns: 1.3fr .8fr; gap: 18px; }
      .hero {
        background: linear-gradient(135deg, #fffaf3 0%, #eaf8ff 100%); border: 3px solid var(--line); border-radius: 26px; padding: 18px;
        min-height: 360px; position: relative; overflow: hidden;
      }
      .doodle-shelf { position: absolute; left: 8%; right: 8%; bottom: 18%; height: 22%; background: #fff; border: 3px dashed var(--secondary); border-radius: 22px; }
      .shelf-row { position: absolute; inset: auto 8% 18% 8%; height: 18px; background: #f6e8bf; border: 3px solid var(--ink); border-radius: 8px; }
      .counter { position: absolute; left: 18%; right: 18%; bottom: 12%; height: 18%; background: #f5c6a5; border: 3px solid var(--ink); border-radius: 18px; }
      .avatar { position: absolute; left: 50%; bottom: 12%; transform: translateX(-50%); width: 120px; height: 140px; background: #fff; border: 3px solid var(--ink); border-radius: 18px 18px 24px 24px; }
      .avatar .head { position: absolute; left: 30%; top: 18%; width: 40%; height: 30%; background: #f5c98d; border: 3px solid var(--ink); border-radius: 18px; }
      .avatar .body { position: absolute; left: 18%; right: 18%; bottom: 0; height: 44%; background: linear-gradient(180deg, #67c0ef, #3e8fe1); border: 3px solid var(--ink); border-radius: 18px 18px 10px 10px; }
      .avatar .hair { position: absolute; left: 22%; right: 22%; top: 10%; height: 18%; background: #2d4058; border: 3px solid var(--ink); border-radius: 14px 14px 6px 6px; }
      .side { display: grid; gap: 14px; }
      .card { background: #fffdf4; border: 3px solid var(--line); border-radius: 22px; padding: 18px; }
      .metric { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
      .metric div { background: #f5f8ff; border: 3px solid var(--ink); border-radius: 16px; padding: 12px; font-weight: 900; text-align: center; }
      .question {
        display: flex; justify-content: center; gap: 12px; font-size: 2.3rem; font-weight: 900; margin: 10px 0 18px;
      }
      .answers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .ans { border: 3px solid var(--ink); border-radius: 16px; padding: 14px 10px; text-align: center; font-size: 1.2rem; font-weight: 900; background: #fff; }
      .ans:nth-child(1) { background: #daf7da; }
      .ans:nth-child(2) { background: #ffe3ae; }
      .ans:nth-child(3) { background: #dfeeff; }
      .bottom { margin-top: 20px; display: grid; grid-template-columns: 1.3fr .7fr; gap: 18px; }
      .rows { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
      .shop-item { background: #fff; border: 3px solid var(--line); border-radius: 18px; padding: 14px; }
      .icon { width: 40px; height: 40px; display: grid; place-items: center; background: #f7d9db; border: 3px solid var(--ink); border-radius: 12px; margin-bottom: 12px; }
      .price { font-weight: 900; color: var(--secondary); }
      .button {
        display: block; border: 3px solid var(--ink); border-radius: 16px; padding: 14px 16px; background: var(--primary);
        text-align: center; font-weight: 900; box-shadow: 0 7px 0 rgba(38,61,91,0.12);
      }
      .button.alt { background: #fff; }
    </style>
  </head>
  <body>
    <div class="screen">
      <div class="topbar">
        <div class="brand">
          <div class="brand-badge">✏️</div>
          <div>
            <div style="font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 900; color: var(--secondary);">loja de desenhos</div>
            <h1>Lojinha Doodle</h1>
          </div>
        </div>
        <div class="cash">R$ 292</div>
      </div>

      <div class="layout">
        <div class="hero">
          <div class="doodle-shelf"></div>
          <div class="shelf-row"></div>
          <div class="counter"></div>
          <div class="avatar">
            <div class="hair"></div>
            <div class="head"></div>
            <div class="body"></div>
          </div>
        </div>

        <div class="side">
          <div class="card">
            <div style="font-size: .72rem; font-weight: 900; text-transform: uppercase; letter-spacing: .12em; color: var(--secondary);">Meta do dia</div>
            <h2 style="margin: 8px 0 12px; font-size: 2rem; line-height: 1.1;">3 clientes</h2>
            <div class="metric">
              <div>🎯 7/10</div>
              <div>⭐ 5</div>
              <div>🧠 18</div>
              <div>🌟 +28</div>
            </div>
          </div>

          <div class="card">
            <div style="font-size: .72rem; font-weight: 900; text-transform: uppercase; letter-spacing: .12em; color: var(--secondary);">Pergunta rápida</div>
            <div class="question"><span>5</span><span>×</span><span>2</span><span>=</span><span>?</span></div>
            <div class="answers">
              <div class="ans">7</div>
              <div class="ans">10</div>
              <div class="ans">12</div>
            </div>
          </div>
        </div>
      </div>

      <div class="bottom">
        <div>
          <div style="font-size: .72rem; font-weight: 900; text-transform: uppercase; letter-spacing: .12em; color: var(--secondary); margin-bottom: 10px;">loja</div>
          <div class="rows">
            <div class="shop-item">
              <div class="icon">📚</div>
              <h3 style="margin: 0 0 8px;">Shelf</h3>
              <div class="price">R$ 30</div>
            </div>
            <div class="shop-item">
              <div class="icon">🎨</div>
              <h3 style="margin: 0 0 8px;">Moldura</h3>
              <div class="price">R$ 48</div>
            </div>
            <div class="shop-item">
              <div class="icon">🌼</div>
              <h3 style="margin: 0 0 8px;">Jardim</h3>
              <div class="price">R$ 72</div>
            </div>
          </div>
        </div>

        <div class="card" style="align-self: start;">
          <div style="font-size: .72rem; font-weight: 900; text-transform: uppercase; letter-spacing: .12em; color: var(--secondary);">Próximo</div>
          <h2 style="margin: 10px 0 12px; font-size: 1.8rem;">Nova rodada</h2>
          <div class="button">Começar</div>
          <div class="button alt" style="margin-top: 10px;">Explorar</div>
        </div>
      </div>
    </div>
  </body>
</html>
