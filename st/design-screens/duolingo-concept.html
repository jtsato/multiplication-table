<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Duolingo Concept</title>
    <style>
      :root {
        --bg: #f5f7f8;
        --panel: #ffffff;
        --ink: #1a1a1a;
        --muted: #6a7b7d;
        --brand: #58cc02;
        --brand-deep: #46a501;
        --brand-soft: #d9facc;
        --orange: #ff9600;
        --pink: #ce82ff;
        --blue: #1cb0f6;
        --red: #ff4b4b;
        --line: #dfe7e2;
        --shadow: #2f7a1f;
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background: linear-gradient(180deg, #effff0 0%, #f6f8f9 100%);
        color: var(--ink);
      }
      .screen {
        width: min(1180px, 92vw);
        margin: 30px auto;
        padding: 24px 22px 32px;
        background: var(--panel);
        border: 3px solid var(--line);
        border-radius: 28px;
        box-shadow: 0 10px 0 rgba(15, 20, 23, 0.06);
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-bottom: 26px;
      }
      .brand-wrap {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .brand-mark {
        width: 58px;
        height: 58px;
        display: grid;
        place-items: center;
        border-radius: 18px;
        background: var(--brand);
        border: 3px solid var(--ink);
        box-shadow: 0 6px 0 var(--shadow);
        font-size: 2rem;
      }
      .eyebrow {
        font-size: 0.75rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--brand-deep);
        font-weight: 900;
        margin: 0 0 8px;
      }
      h1 {
        margin: 0;
        font-size: clamp(2.3rem, 4vw, 4rem);
        line-height: 1.02;
      }
      .cash {
        background: var(--orange);
        border: 3px solid var(--ink);
        border-radius: 999px;
        font-weight: 900;
        padding: 12px 18px;
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.12);
      }
      .store-preview {
        display: grid;
        grid-template-columns: 1.5fr 1fr;
        gap: 20px;
        align-items: stretch;
      }
      .diorama {
        position: relative;
        min-height: 360px;
        background: linear-gradient(180deg, #eafaf2 0%, #d9f6fb 100%);
        border: 3px solid var(--ink);
        border-radius: 24px;
        overflow: hidden;
      }
      .sun {
        position: absolute;
        right: 34px;
        top: 28px;
        width: 90px;
        height: 90px;
        border-radius: 50%;
        background: #ffe782;
        border: 3px solid var(--ink);
      }
      .shelf {
        position: absolute;
        width: 36%;
        height: 28%;
        border: 3px solid var(--ink);
        border-radius: 16px;
        background: #ffffff;
        box-shadow: 0 8px 0 rgba(17, 22, 24, 0.08);
      }
      .shelf.left {
        left: 8%;
        top: 18%;
      }
      .shelf.right {
        right: 8%;
        top: 26%;
      }
      .counter {
        position: absolute;
        left: 18%;
        right: 18%;
        bottom: 18%;
        height: 18%;
        border: 3px solid var(--ink);
        background: #f7d7aa;
        border-radius: 16px;
        box-shadow: 0 10px 0 rgba(14, 16, 18, 0.12);
      }
      .avatar {
        position: absolute;
        left: 50%;
        bottom: 12%;
        transform: translateX(-50%);
        width: 118px;
        height: 140px;
        background: #fff;
        border: 3px solid var(--ink);
        border-radius: 18px 18px 24px 24px;
      }
      .avatar .head {
        position: absolute;
        left: 32%;
        top: 16%;
        width: 36%;
        height: 28%;
        background: #f2c58d;
        border-radius: 14px;
        border: 3px solid var(--ink);
      }
      .avatar .body {
        position: absolute;
        left: 18%;
        right: 18%;
        bottom: 0;
        height: 42%;
        background: #7bbdff;
        border: 3px solid var(--ink);
        border-radius: 18px 18px 10px 10px;
      }
      .avatar .hair {
        position: absolute;
        left: 24%;
        right: 24%;
        top: 10%;
        height: 18%;
        background: #7a4f2f;
        border-radius: 16px 16px 8px 8px;
        border: 3px solid var(--ink);
      }
      .side-panel {
        display: grid;
        gap: 16px;
      }
      .info-card,
      .question-card {
        background: #fffaf1;
        border: 3px solid var(--line);
        border-radius: 22px;
        padding: 18px;
      }
      .mini-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 14px;
      }
      .pill {
        background: var(--brand-soft);
        border: 2px solid var(--ink);
        border-radius: 999px;
        padding: 10px 12px;
        text-align: center;
        font-weight: 900;
      }
      .progress {
        height: 18px;
        border: 3px solid var(--ink);
        border-radius: 999px;
        background: #eef0ef;
        overflow: hidden;
      }
      .progress > span {
        display: block;
        height: 100%;
        width: 72%;
        background: linear-gradient(90deg, var(--brand) 0%, #88dc3d 100%);
      }
      .question-card {
        background: #fff;
        border-color: var(--ink);
        box-shadow: 0 9px 0 rgba(17, 22, 24, 0.08);
      }
      .question {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-size: 2.2rem;
        font-weight: 900;
        margin: 12px 0 18px;
      }
      .answer-row {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }
      .answer {
        border: 3px solid var(--ink);
        border-radius: 16px;
        background: #fff;
        padding: 12px 8px;
        font-size: 1.3rem;
        font-weight: 900;
      }
      .answer:nth-child(1) {
        background: #d9facc;
      }
      .answer:nth-child(2) {
        background: #fff5cf;
      }
      .answer:nth-child(3) {
        background: #d9ebff;
      }
      .bottom {
        margin-top: 24px;
        display: grid;
        grid-template-columns: 1.45fr 0.85fr;
        gap: 18px;
      }
      .shop-list {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }
      .shop-item {
        padding: 16px 12px;
        background: #fff;
        border: 3px solid var(--line);
        border-radius: 18px;
      }
      .shop-item .icon {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: var(--brand-soft);
        border: 2px solid var(--ink);
        margin-bottom: 12px;
      }
      .shop-item h3 {
        margin: 0 0 6px;
        font-size: 1.1rem;
      }
      .price {
        font-weight: 900;
        color: var(--red);
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 3px solid var(--ink);
        border-radius: 14px;
        padding: 12px 18px;
        background: var(--brand);
        box-shadow: 0 6px 0 var(--brand-deep);
        font-weight: 900;
      }
      .button.alt {
        background: #fff;
        box-shadow: 0 6px 0 #d3dbe1;
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <div class="topbar">
        <div class="brand-wrap">
          <div class="brand-mark">✦</div>
          <div>
            <p class="eyebrow">uma loja para descobrir</p>
            <h1>Lojinha Maluca</h1>
          </div>
        </div>
        <div class="cash">R$ 268</div>
      </div>

      <div class="store-preview">
        <div class="diorama">
          <div class="sun"></div>
          <div class="shelf left"></div>
          <div class="shelf right"></div>
          <div class="counter"></div>
          <div class="avatar">
            <div class="hair"></div>
            <div class="head"></div>
            <div class="body"></div>
          </div>
        </div>

        <div class="side-panel">
          <div class="info-card">
            <p class="eyebrow">Objetivo do dia</p>
            <h2 style="margin: 0 0 12px; font-size: 2rem">Peça de 3 clientes</h2>
            <div class="progress"><span></span></div>
            <div class="mini-grid">
              <div class="pill">⭐ 5 conquistas</div>
              <div class="pill">🧠 16 fatos</div>
              <div class="pill">🏪 4 itens</div>
              <div class="pill">🎉 +32 XP</div>
            </div>
          </div>

          <div class="question-card">
            <p class="eyebrow" style="margin-bottom: 6px">Pergunta atual</p>
            <div class="question">
              <span>4</span><span>×</span><span>3</span><span>=</span><span>?</span>
            </div>
            <div class="answer-row">
              <div class="answer">9</div>
              <div class="answer">12</div>
              <div class="answer">15</div>
            </div>
          </div>
        </div>
      </div>

      <div class="bottom">
        <div>
          <p class="eyebrow">loja</p>
          <div class="shop-list">
            <div class="shop-item">
              <div class="icon">📚</div>
              <h3>Prateleira</h3>
              <div class="price">R$ 35</div>
            </div>
            <div class="shop-item">
              <div class="icon">🎨</div>
              <h3>Painel</h3>
              <div class="price">R$ 52</div>
            </div>
            <div class="shop-item">
              <div class="icon">🌱</div>
              <h3>Jardim</h3>
              <div class="price">R$ 80</div>
            </div>
          </div>
        </div>

        <div class="info-card" style="align-self: start">
          <p class="eyebrow">Próximo passo</p>
          <h2 style="margin: 0 0 12px; font-size: 1.8rem">Continue a loja</h2>
          <div class="button" style="width: 100%; margin-bottom: 10px">Iniciar dia</div>
          <div class="button alt" style="width: 100%">Ver loja</div>
        </div>
      </div>
    </div>
  </body>
</html>
